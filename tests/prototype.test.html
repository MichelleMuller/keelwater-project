<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Keelwater prototype tests</title>
<style>
  body { font: 14px/1.5 -apple-system, "Segoe UI", sans-serif; margin: 24px; color: #1f2328; }
  #results { background: #f6f8fa; padding: 12px 16px; border-radius: 6px; }
  iframe { width: 1440px; height: 900px; border: 1px solid #d0d7de; margin-top: 16px; }
</style>
</head>
<body>
<h1>Keelwater prototype tests</h1>
<p>Run with <code>tests/run.sh</code>. Opening this file directly needs a browser that lets local files talk to each other (Chrome with <code>--allow-file-access-from-files</code>).</p>
<pre id="results">Running…</pre>
<iframe id="app" title="Prototype under test"></iframe>

<script>
const APP = "../04-working-material/solution-prototype/keelwater-prototype.html";
const tests = [];
const test = (name, fn) => tests.push({ name, fn });

function assert(cond, msg) {
  if (!cond) throw new Error(msg || "assertion failed");
}
function eq(actual, expected, msg) {
  const a = JSON.stringify(actual), e = JSON.stringify(expected);
  if (a !== e) throw new Error(`${msg || "not equal"}: got ${a}, expected ${e}`);
}
const near = (a, b, tol = 1) => Math.abs(a - b) <= tol;

// Loads a fresh copy of the prototype and returns helpers bound to it.
let loads = 0;
function open(hash = "consumer") {
  return new Promise((resolve, reject) => {
    const frame = document.getElementById("app");
    frame.onload = () => {
      const w = frame.contentWindow;
      let doc;
      try { doc = w.document; } catch (e) { return reject(new Error("can't reach the prototype frame: run with --allow-file-access-from-files")); }
      const $ = (sel) => doc.querySelector(sel);
      const $$ = (sel) => [...doc.querySelectorAll(sel)];
      const app = {
        w, doc, $, $$,
        ev: (code) => w.eval(code),
        click(sel) {
          const el = $(sel);
          if (!el) throw new Error(`nothing matches ${sel}`);
          el.click();
        },
        type(sel, value) {
          const el = $(sel);
          if (!el) throw new Error(`nothing matches ${sel}`);
          el.focus();
          el.value = value;
          el.dispatchEvent(new w.Event("input", { bubbles: true }));
          return el;
        },
        goToStep(n) {
          if (app.ev("state.form.step") === -1) app.click('[data-action="form-step"][data-value="0"]');
          app.click(`.stepper [data-value="${n}"]`);
        },
      };
      resolve(app);
    };
    frame.src = `${APP}?load=${++loads}#${hash}`;
  });
}

/* ---------- Data ---------- */

test("seed data: 60 claims split 28 / 20 / 12 across the three insurers, unique ids", async () => {
  const app = await open();
  const claims = app.ev("state.claims");
  eq(claims.length, 60);
  const count = (id) => claims.filter((c) => c.insurer === id).length;
  eq([count("harbour"), count("northgate"), count("fleetwise")], [28, 20, 12]);
  eq(new Set(claims.map((c) => c.id)).size, 60, "ids are unique");
});

test("seed data is the same on every load", async () => {
  const app = await open();
  eq(app.ev("JSON.stringify(seedClaims())"), app.ev("JSON.stringify(seedClaims())"));
});

test("seed data: every claim's missing info matches the rules, and nothing is sorted yet", async () => {
  const app = await open();
  for (const c of app.ev("state.claims")) {
    eq(c.missingInfo, app.w.requiredItems(c), c.id);
    eq(c.pile, null, `${c.id} pile`);
  }
});

test("seed data: roughly the brief's share of claims has waited over 4 hours (10–30%)", async () => {
  const app = await open();
  const now = new Date("2026-10-17T09:30:00Z").getTime();
  const claims = app.ev("state.claims");
  const late = claims.filter((c) => now - new Date(c.receivedAt).getTime() > 4 * 3600000).length / claims.length;
  assert(late >= 0.1 && late <= 0.3, `${Math.round(late * 100)}% over 4 h`);
});

test("there are three piles; missing information is a status, not a pile (A-19)", async () => {
  const app = await open();
  eq(app.ev("PILES"), ["Simple", "Needs a closer look", "Suspicious"]);
});

test("required items: theft needs a police report but no photos", async () => {
  const app = await open();
  const c = { incident: { type: "theft", policeReport: false }, parties: {}, damage: { photos: 0, estimatedAmount: 500 } };
  eq(app.w.requiredItems(c), ["police report"]);
});

test("required items: third party without a registration, and a big claim without an estimate", async () => {
  const app = await open();
  const c = { incident: { type: "collision", policeReport: true }, parties: { thirdPartyInvolved: true, thirdParty: { reg: "" } }, damage: { photos: 2, estimatedAmount: 2500, repairEstimate: false } };
  eq(app.w.requiredItems(c), ["third party's vehicle registration", "repair estimate"]);
});

test("required items: a complete windscreen claim needs nothing", async () => {

  const c = { incident: { type: "windscreen", policeReport: false }, parties: { thirdPartyInvolved: false, injuries: false }, damage: { photos: 2, estimatedAmount: 400 } };
  eq(app.w.requiredItems(c), []);
});

/* ---------- Routing and shell ---------- */

});

test("form: progress bar labels all start on the same line", async () => {
  const app = await open();
  app.goToStep(0);
  const tops = app.$$(".stepper button").map((b) => {
    const range = app.doc.createRange();
    range.selectNodeContents(b);
    return range.getClientRects()[0].top;
  });
  assert(tops.every((t) => near(t, tops[0])), `label tops differ: ${tops.map(Math.round)}`);
});

test("form: side-by-side inputs line up on every step", async () => {
  const app = await open();
  const check = (label) => {
    const fields = app.$$(".form-grid > .field");
    const rows = [];
    let col = 0;
    for (const f of fields) {
      if (f.classList.contains("full")) { col = 0; continue; }
      if (col === 0) rows.push([f]); else rows[rows.length - 1].push(f);
      col = (col + 1) % 2;
    }
    for (const row of rows.filter((r) => r.length === 2)) {
      const [a, b] = row.map((f) => f.querySelector(".input, .yes-no").getBoundingClientRect().top);
      assert(near(a, b), `${label}: "${row[0].querySelector("label").textContent}" and "${row[1].querySelector("label").textContent}" inputs differ by ${Math.round(Math.abs(a - b))}px`);
    }
  };
  for (const step of [0, 1, 2]) { app.goToStep(step); check(`step ${step + 1}`); }
  app.goToStep(3);
  app.click('[data-field="parties.thirdPartyInvolved"][data-value="true"]');
  app.click('[data-field="incident.policeReport"][data-value="true"]');
  check("step 4 with third party");
});

/* ---------- Inbox (current state) ---------- */

const harbourTodo = (app) => app.ev("state.claims.filter(c => c.insurer === 'harbour' && !c.pile)");
const tabCounts = (app) => app.$$(".tabs button").map((b) => Number(b.querySelector(".muted").textContent));

  const ids = app.$$(".claim-row").map((r) => r.dataset.value);
  eq(ids, harbourTodo(app).map((c) => c.id));

  eq(tabCounts(app), [28, 0, 28]);

  const app = await open("handler/inbox");

  const check = () => {
    eq(card().querySelector(".muted").textContent, "Median time to sort");
    eq(card().querySelector(".stat-value").textContent, "11 min");
    assert(card().textContent.includes("from arrival to sorted (brief)"));
  };
  check();
  app.click(".claim-row");
  app.click('[data-action="sort-claim"][data-value="Simple"]');
  app.click('[data-action="sort-claim"][data-value="Simple"]');
  check();
});

test("inbox: opening a claim shows everything a handler reads", async () => {
  const app = await open("handler/inbox");
  const c = harbourTodo(app).find((x) => x.missingInfo.length && x.parties.thirdPartyInvolved);
  app.click(`.claim-row[data-value="${c.id}"]`);
  const text = app.$(".claim-detail").textContent;
  for (const s of [c.claimant.name, c.id, c.incident.description, c.fraud.vendor, c.policy.number, ...c.missingInfo]) {
    assert(text.includes(s), `detail shows ${s}`);
  }
  eq(app.$$(".photo-strip .photo-tile").length, c.damage.photos);
  eq(app.$(".claim-row[aria-current='true']").dataset.value, c.id, "row is highlighted");
});

test("inbox: sorting a claim updates the record, history and counter, then opens the next one", async () => {
  const app = await open("handler/inbox");
  const [first, second] = harbourTodo(app);
  app.click(`.claim-row[data-value="${first.id}"]`);
  app.click('[data-action="sort-claim"][data-value="Simple"]');
  const c = app.ev(`state.claims.find(c => c.id === "${first.id}")`);
  eq(c.pile, "Simple");
  const last = c.history[c.history.length - 1];
  eq([last.actor, last.action], ["you", "Sorted into Simple"]);
  eq(app.ev("state.inbox.sortedByYou"), 1);
  eq(app.ev("state.inbox.openId"), second.id, "next claim opened");
  eq(tabCounts(app), [27, 1, 28]);
  assert(!app.$(`.claim-row[data-value="${first.id}"]`), "gone from To sort");
  app.click('[data-action="inbox-tab"][data-value="sorted"]');
  eq(app.$$(".claim-row").map((r) => r.dataset.value), [first.id]);
});

test("inbox: changing the pile of a sorted claim is logged as a move and not counted twice", async () => {
  const app = await open("handler/inbox");
  const first = harbourTodo(app)[0];
  app.click('[data-action="inbox-tab"][data-value="all"]');
  app.click(`.claim-row[data-value="${first.id}"]`);
  app.click('[data-action="sort-claim"][data-value="Simple"]');
  eq(app.ev("state.inbox.openId"), first.id, "stays open in the All tab");
  app.click('[data-action="sort-claim"][data-value="Suspicious"]');
  const c = app.ev(`state.claims.find(c => c.id === "${first.id}")`);
  eq(c.pile, "Suspicious");
  eq(c.history[c.history.length - 1].action, "Moved from Simple to Suspicious");
  eq(app.ev("state.inbox.sortedByYou"), 1);
});

test("inbox: asking for missing info sets a status, not a pile (A-19)", async () => {
  const app = await open("handler/inbox");
  const c0 = harbourTodo(app).find((x) => x.missingInfo.length);
  app.click(`.claim-row[data-value="${c0.id}"]`);
  app.click('[data-action="request-info"]');
  let c = app.ev(`state.claims.find(c => c.id === "${c0.id}")`);
  eq([c.status, c.pile], ["waiting on claimant", null]);
  eq(c.history[c.history.length - 1].action, "Asked claimant for missing info");
  assert(!app.$('[data-action="request-info"]'), "can't ask twice");
  assert(app.$(`.claim-row[data-value="${c0.id}"] .badge.waiting`).textContent.includes("Waiting on claimant"));
  app.click('[data-action="sort-claim"][data-value="Needs a closer look"]');
  c = app.ev(`state.claims.find(c => c.id === "${c0.id}")`);
  eq([c.status, c.pile], ["waiting on claimant", "Needs a closer look"], "status survives sorting");
});

/* ---------- Bulk sorting (Phase 1) ---------- */

function filterBy(app, key, value) {
  const select = app.$(`[data-filter="${key}"]`);
  if (!select) throw new Error(`no filter ${key}`);
  select.value = value;
  select.dispatchEvent(new app.w.Event("change", { bubbles: true }));
}
const tableIds = (app) => app.$$("tbody tr").map((r) => r.dataset.id);
const claimById = (app, id) => app.ev(`state.claims.find(c => c.id === "${id}")`);
const captureLog = (app) => app.ev("state.bulk.log");

test("bulk: table shows the insurer's unsorted claims, newest first", async () => {
  const app = await open("handler/bulk");
  const todo = harbourTodo(app);
  eq(tableIds(app), todo.map((c) => c.id));
  eq(app.$$(".stat-value").map((s) => s.textContent), ["28", "28", "0", "0"]);
});

test("bulk: filters narrow the table, and combine", async () => {
  const app = await open("handler/bulk");
  filterBy(app, "type", "windscreen");
  const ids = tableIds(app);
  assert(ids.length > 0, "some windscreen claims");
  assert(ids.every((id) => claimById(app, id).incident.type === "windscreen"));
  filterBy(app, "amount", "under1k");
  const expected = harbourTodo(app).filter((c) => c.incident.type === "windscreen" && c.damage.estimatedAmount < 1000).map((c) => c.id);
  eq(tableIds(app), expected);
  eq(app.$$(".stat-value")[1].textContent, String(expected.length));
});

test("bulk: every filter option works without errors", async () => {
  const app = await open("handler/bulk");
  for (const select of app.$$("[data-filter]")) {
    const key = select.dataset.filter;
    for (const opt of [...select.options]) {
      filterBy(app, key, opt.value);
      const shown = tableIds(app).map((id) => claimById(app, id));
      const f = app.ev("state.bulk.filters");
      assert(shown.every((c) => app.w.matchesFilters(c, f)), `${key}=${opt.value}`);
    }
    filterBy(app, key, key === "status" ? "unsorted" : "");
  }
});

test("bulk: each filter change is captured with a plain description and count", async () => {
  const app = await open("handler/bulk");
  filterBy(app, "type", "windscreen");
  filterBy(app, "thirdParty", "no");

/* ---------- Automation (Phase 2): rules learned from behaviour ---------- */

const WINDSCREEN = "Windscreen, under £1,000, no third party";
const COLLISION_TP = "Collision, third party";

function ruleKeyFor(app, text, pile) {
  const key = app.ev(`learnedRules(state.insurer).find(r => ruleText(r) === ${JSON.stringify(text)} && r.pile === ${JSON.stringify(pile)})?.key`);
  if (!key) throw new Error(`no learned rule "${text}" → ${pile}`);
  return key;
}
function ruleButton(app, action, key, value) {
  const btn = app.$$(`[data-action="${action}"]`).find((b) => b.dataset.rule === key && (value === undefined || b.dataset.value === value));
  if (!btn) throw new Error(`no ${action} button for ${key}`);
  return btn;
}
async function withExample() {
  const app = await open("handler/bulk");
  app.click('[data-action="bulk-load-example"]');
  return app;
}
function accept(app, text, pile) {
  const key = ruleKeyFor(app, text, pile);
  app.ev(`acceptRule(${JSON.stringify(key)}); render();`);
  return key;
}
const activeRule = (app, key) => app.ev(`state.automation.rules.find(r => r.key === ${JSON.stringify(key)})`);
const suggestion = (app, id) => app.ev(`(() => { const s = suggestionFor(state.claims.find(c => c.id === "${id}")); return s && { pile: s.pile, heldBack: s.heldBack || null, rule: ruleText(s.rule) }; })()`);

  eq(rules.map((r) => r.claims), [...rules.map((r) => r.claims)].sort((a, b) => b - a));
  const ws = app.ev(`learnedRules('harbour').find(r => r.pile === "Simple" && ruleText(r) === ${JSON.stringify(WINDSCREEN)})`);

  eq(app.$$(".rule-row.suggested").length, 3, "top 3 shown");

  for (const c of harbourTodo(app)) {
    const s = suggestion(app, c.id);
    const matches = app.ev(`matchesRule(state.claims.find(c => c.id === "${c.id}"), state.automation.rules[0])`);
    const col = app.$$("thead th").findIndex((th) => th.textContent === "Suggested");
    const cell = app.$(`tr[data-id="${c.id}"]`).children[col].textContent;
    if (!matches) { eq(s, null, c.id); continue; }
    if (s.pile) assert(cell.includes("Simple") && cell.includes(WINDSCREEN), `${c.id} shows pile and reason`);
    else assert(cell.includes("held back"), `${c.id} shows held back`);
  }
});

(async () => {
  const out = [];

  for (const t of tests) {
    try {
      await t.fn();
      passed++;
      out.push(`✓ ${t.name}`);
    } catch (e) {
      out.push(`✗ ${t.name}\n    ${e.message}`);
    }
  }
  const summary = `${passed === tests.length ? "PASS" : "FAIL"} ${passed}/${tests.length}`;
  out.push("", summary);
  document.getElementById("results").textContent = out.join("\n");
  document.title = summary;
})();
