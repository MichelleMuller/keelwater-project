<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
<rect width="760" height="640" fill="#ffffff"/>
<text x="30" y="34" font-size="12" fill="#8c959f">Recreation of the question form the AI showed in Cursor, 2026-10-16. Selected answers marked.</text>
<rect x="20" y="50" width="720" height="570" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="44" y="86" font-size="17" font-weight="600" fill="#1f2328">Auto-sorting decisions</text>

<text x="44" y="126" font-weight="600" fill="#1f2328">Where should the fraud score come from?</text>
<circle cx="56" cy="152" r="7" fill="#0969da"/><circle cx="56" cy="152" r="3" fill="#ffffff"/>
<text x="74" y="157" fill="#1f2328">Integrate the customer's existing fraud vendor, with Keelwater rules as a fallback (Recommended)</text>
<circle cx="56" cy="180" r="7" fill="none" stroke="#8c959f"/>
<text x="74" y="185" fill="#59636e">Keelwater builds its own fraud model</text>
<circle cx="56" cy="208" r="7" fill="none" stroke="#8c959f"/>
<text x="74" y="213" fill="#59636e">Rules only, no external score</text>
<circle cx="56" cy="236" r="7" fill="none" stroke="#8c959f"/>
<text x="74" y="241" fill="#59636e">Other</text>

<text x="44" y="290" font-weight="600" fill="#1f2328">Can a claim be sorted as Simple without a fraud check?</text>
<circle cx="56" cy="316" r="7" fill="#0969da"/><circle cx="56" cy="316" r="3" fill="#ffffff"/>
<text x="74" y="321" fill="#1f2328">Never (Recommended)</text>
<circle cx="56" cy="344" r="7" fill="none" stroke="#8c959f"/>
<text x="74" y="349" fill="#59636e">Only under a low value threshold</text>
<circle cx="56" cy="372" r="7" fill="none" stroke="#8c959f"/>
<text x="74" y="377" fill="#59636e">Each customer decides</text>
<circle cx="56" cy="400" r="7" fill="none" stroke="#8c959f"/>
<text x="74" y="405" fill="#59636e">Other</text>

<text x="44" y="454" font-weight="600" fill="#1f2328">In version 1, should Keelwater trigger payment for Simple claims, or only sort them?</text>
<circle cx="56" cy="480" r="7" fill="#0969da"/><circle cx="56" cy="480" r="3" fill="#ffffff"/>
<text x="74" y="485" fill="#1f2328">Sort only; payment stays with the insurer (Recommended)</text>
<circle cx="56" cy="508" r="7" fill="none" stroke="#8c959f"/>
<text x="74" y="513" fill="#59636e">Auto-pay Simple claims for customers who opt in</text>
<circle cx="56" cy="536" r="7" fill="none" stroke="#8c959f"/>
<text x="74" y="541" fill="#59636e">Other</text>

<rect x="600" y="570" width="116" height="34" rx="6" fill="#1f883d"/>
<text x="658" y="592" text-anchor="middle" fill="#ffffff" font-weight="600">Submit</text>
</svg>
